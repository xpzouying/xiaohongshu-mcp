name: Docker Images

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker-*.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker-*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          use: false

      # 使用同一份 PR 代码构建两种镜像，测试过程中不登录或推送仓库。
      - name: Build default headless image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          load: true
          tags: xhs-mcp:ci
          build-args: VERSION=ci
          # PR 缓存与正式发布缓存隔离，避免混用不受信任的构建结果。
          cache-from: type=gha,scope=ci-headless
          cache-to: type=gha,scope=ci-headless,mode=max
          provenance: false
          sbom: false

      - name: Check headless image remains the default
        run: |
          test "$(docker image inspect xhs-mcp:ci --format '{{json .Config.Cmd}}')" = '["./app"]'
          docker run --rm --entrypoint /bin/sh xhs-mcp:ci -c '! command -v Xvfb && ! command -v x11vnc && ! command -v fcitx5'

      - name: Build optional noVNC image
        # 默认 docker builder 可以读取上一步加载到本机的基础镜像。
        run: docker build --builder default --build-arg MCP_IMAGE=xhs-mcp:ci -t xhs-mcp:ci-novnc docker/novnc

      - name: Check noVNC startup, access boundaries and recovery
        run: python3 docker/novnc/smoke_test.py xhs-mcp:ci-novnc

      # 扫描工具只运行在 CI，不进入任何成品镜像；下载文件按固定 SHA256 校验。
      - name: Scan images and reject new GUI high or critical vulnerabilities
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: |
          mkdir -p "$RUNNER_TEMP/image-audit"
          archive="$RUNNER_TEMP/grype.tar.gz"
          curl -fsSL --retry 3 https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' '64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" grype
          "$RUNNER_TEMP/grype" db update
          export GRYPE_DB_AUTO_UPDATE=false
          "$RUNNER_TEMP/grype" docker:xhs-mcp:ci --quiet -o json > "$RUNNER_TEMP/image-audit/headless.json"
          "$RUNNER_TEMP/grype" docker:xhs-mcp:ci-novnc --quiet -o json > "$RUNNER_TEMP/image-audit/novnc.json"
          python3 docker/novnc/check_vulnerabilities.py "$RUNNER_TEMP/image-audit/headless.json" "$RUNNER_TEMP/image-audit/novnc.json"

      - name: Save image vulnerability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-security-reports
          path: ${{ runner.temp }}/image-audit/*.json
          if-no-files-found: ignore
